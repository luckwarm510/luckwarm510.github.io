<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>No-Guess Minesweeper</title>
<style>
/* ===== GLOBAL ===== */
* {
    box-sizing: border-box;
    font-family: "MS Sans Serif", Tahoma, Arial, sans-serif;
}
html, body {
    margin: 0;
    padding: 0;
    background: #808080;
    color: #000;
    width: 100%;
    height: 100%;
    overflow: auto;
}

/* ===== LAYOUT ===== */
#app {
    display: flex;
    gap: 12px;
    padding: 12px;
    min-width: max-content;
}
#app.right {
    flex-direction: row;
}
#app.bottom {
    flex-direction: column;
}

/* ===== WINDOW ===== */
.window {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #404040 #404040 #fff;
    padding: 8px;
}
.titlebar {
    background: #000;
    color: #fff;
    padding: 4px 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
button {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #404040 #404040 #fff;
    padding: 4px 10px;
    cursor: pointer;
}
button:active {
    border-color: #404040 #fff #fff #404040;
}

/* ===== GAME UI ===== */
#top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
}
.counter {
    background: #000;
    color: #fff;
    padding: 4px 8px;
    min-width: 80px;
    text-align: center;
}
#board {
    display: grid;
    background: #808080;
    border: 2px solid;
    border-color: #404040 #fff #fff #404040;
}
.cell {
    width: 26px;
    height: 26px;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #404040 #404040 #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    font-weight: bold;
}
.cell.revealed {
    border: 1px solid #808080;
    background: #c0c0c0;
}
.cell.flag {
    background: #c0c0c0;
}
.cell.mine {
    background: #c0c0c0;
}

/* ===== SCORES ===== */
#scores {
    min-width: 220px;
}
table {
    width: 100%;
    border-collapse: collapse;
}
th, td {
    border: 1px solid #404040;
    padding: 4px;
    text-align: center;
}

/* ===== MODAL ===== */
#modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}
#modal .window {
    width: 260px;
}
input {
    width: 100%;
    margin-top: 6px;
}
</style>
</head>
<body>

<div id="app" class="right">

    <!-- GAME -->
    <div class="window">
        <div class="titlebar">
            <span>No-Guess Minesweeper</span>
            <button id="toggleScores">Toggle Scores</button>
        </div>
        <div id="top">
            <div class="counter">Mines: <span id="mines"></span></div>
            <button id="newGame">New</button>
            <div class="counter">Time: <span id="time">0</span></div>
        </div>
        <div id="board"></div>
    </div>

    <!-- SCORES -->
    <div id="scores" class="window">
        <h4>High Scores</h4>
        <table>
            <thead>
                <tr><th>Name</th><th>Time</th></tr>
            </thead>
            <tbody id="scoreTable"></tbody>
        </table>
    </div>

</div>

<!-- MODAL -->
<div id="modal">
    <div class="window">
        <div id="modalText"></div>
        <div id="modalButtons"></div>
    </div>
</div>

<script>
const rows = 9, cols = 9, mineCount = 10;
let board = [], revealed = 0, flags = 0, time = 0, timer;
const boardEl = document.getElementById("board");
const modal = document.getElementById("modal");
const modalText = document.getElementById("modalText");
const modalButtons = document.getElementById("modalButtons");
const toggleScores = document.getElementById("toggleScores");
const newGame = document.getElementById("newGame");
const scoreTable = document.getElementById("scoreTable");
const app = document.getElementById("app");

boardEl.style.gridTemplateColumns = `repeat(${cols}, 26px)`;

function start() {
    clearInterval(timer);
    time = 0;
    revealed = 0;
    flags = 0;
    document.getElementById("time").textContent = 0;
    document.getElementById("mines").textContent = mineCount;
    board = [];
    boardEl.innerHTML = "";

    for (let r=0;r<rows;r++) {
        board[r] = [];
        for (let c=0;c<cols;c++) {
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.oncontextmenu = e => e.preventDefault();
            boardEl.appendChild(cell);
            board[r][c] = {cell,mine:false,flag:false,revealed:false,count:0};
            cell.onmousedown = e => clickCell(e,r,c);
        }
    }

    let placed = 0;
    while (placed < mineCount) {
        let r = Math.random()*rows|0, c = Math.random()*cols|0;
        if (!board[r][c].mine) {
            board[r][c].mine = true;
            placed++;
        }
    }

    for (let r=0;r<rows;r++)
        for (let c=0;c<cols;c++)
            board[r][c].count = countMines(r,c);

    timer = setInterval(()=>document.getElementById("time").textContent=++time,1000);
}

function countMines(r,c) {
    let n=0;
    for (let i=-1;i<=1;i++)
        for (let j=-1;j<=1;j++) {
            let nr=r+i,nc=c+j;
            if (board[nr]?.[nc]?.mine) n++;
        }
    return n;
}

function clickCell(e,r,c) {
    const cell = board[r][c];
    if (e.button===2) {
        if (cell.revealed) {
            chord(r,c);
            return;
        }
        if (!cell.flag) {
            cell.flag=true; flags++;
            cell.cell.textContent="F";
        } else {
            cell.flag=false; flags--;
            cell.cell.textContent="";
        }
        return;
    }
    reveal(r,c);
}

function reveal(r,c) {
    const cell = board[r][c];
    if (!cell || cell.revealed || cell.flag) return;
    cell.revealed = true;
    cell.cell.classList.add("revealed");
    revealed++;
    if (cell.mine) {
        cell.cell.textContent="*";
        clearInterval(timer);
        alert("Game Over");
        return;
    }
    if (cell.count>0) cell.cell.textContent = cell.count;
    else for (let i=-1;i<=1;i++)
        for (let j=-1;j<=1;j++)
            reveal(r+i,c+j);

    if (revealed === rows*cols-mineCount) win();
}

function chord(r,c) {
    const cell = board[r][c];
    let f=0;
    for (let i=-1;i<=1;i++)
        for (let j=-1;j<=1;j++)
            if (board[r+i]?.[c+j]?.flag) f++;
    if (f===cell.count)
        for (let i=-1;i<=1;i++)
            for (let j=-1;j<=1;j++)
                reveal(r+i,c+j);
}

function win() {
    clearInterval(timer);
    showModal();
}

function showModal() {
    const modal = document.getElementById("modal");
    modal.style.display="flex";
    modalText.textContent="Register your record?";
    modalButtons.innerHTML="";
    modalButtons.append(
        btn("Yes",askName),
        btn("No",()=>modal.style.display="none")
    );
}

function askName() {
    modalText.textContent="Your name:";
    modalButtons.innerHTML="";
    const input=document.createElement("input");
    modalButtons.append(input, btn("Save",()=>{
        saveScore(input.value);
        modal.style.display="none";
    }));
}

function btn(t,f){const b=document.createElement("button");b.textContent=t;b.onclick=f;return b;}

function saveScore(name){
    const s=JSON.parse(localStorage.scores||"[]");
    s.push({name,time});
    localStorage.scores=JSON.stringify(s);
    loadScores();
}

function loadScores(){
    scoreTable.innerHTML="";
    (JSON.parse(localStorage.scores||"[]"))
        .sort((a,b)=>a.time-b.time)
        .forEach(s=>{
            scoreTable.innerHTML+=`<tr><td>${s.name}</td><td>${s.time}</td></tr>`;
        });
}

toggleScores.onclick=()=>{
    app.className = app.className==="right"?"bottom":"right";
};

newGame.onclick=start;
loadScores();
start();
</script>
</body>
</html>
