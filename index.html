<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>No-Guess Minesweeper</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #3a3a3a;
    font-family: "MS Sans Serif", Tahoma, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 30px;
}

/* ===== MAIN WINDOW ===== */

.window {
    background: #c0c0c0;
    padding: 10px;
    border: 2px solid #ffffff;
    border-right-color: #404040;
    border-bottom-color: #404040;
    width: max-content;
}

/* ===== TITLE BAR ===== */

.titlebar {
    background: #000000;
    color: #ffffff;
    padding: 6px;
    font-size: 14px;
    text-align: center;
    margin-bottom: 8px;
}

/* ===== CONTROLS ===== */

.controls {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin-bottom: 6px;
}

button {
    background: #c0c0c0;
    border: 2px solid #ffffff;
    border-right-color: #404040;
    border-bottom-color: #404040;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
}

button:active {
    border: 2px solid #404040;
    border-right-color: #ffffff;
    border-bottom-color: #ffffff;
}

button.active {
    border: 2px inset #808080;
    font-weight: bold;
}

/* ===== STATUS BAR ===== */

.status {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 6px;
}

.panel {
    background: #000000;
    color: #ffffff;
    font-family: "Courier New", monospace;
    padding: 4px 6px;
    border: 2px inset #808080;
    min-width: 80px;
    text-align: center;
}

/* ===== BOARD ===== */

#board {
    display: grid;
    background: #808080;
    padding: 4px;
    border: 2px inset #808080;
}

/* ===== CELLS ===== */

.cell {
    width: 24px;
    height: 24px;
    background: #c0c0c0;
    border: 2px solid #ffffff;
    border-right-color: #404040;
    border-bottom-color: #404040;
    font-size: 13px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    cursor: pointer;
}

.cell.revealed {
    background: #b0b0b0;
    border: 1px solid #808080;
    cursor: default;
}

.cell.flagged {
    background: #a0a0a0;
}

.cell.mine {
    background: #000000;
    color: #ffffff;
}

/* numbers stay grayscale */
.num-1,.num-2,.num-3,.num-4,.num-5,.num-6,.num-7,.num-8 {
    color: #000000;
}

/* ===== MESSAGE ===== */

.message {
    margin-top: 6px;
    text-align: center;
    font-weight: bold;
    font-size: 12px;
}

/* ===== HIGHSCORES ===== */

.scores {
    margin-top: 10px;
    background: #c0c0c0;
    border: 2px inset #808080;
    padding: 6px;
}

.scores h2 {
    font-size: 13px;
    text-align: center;
    margin-bottom: 6px;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}

th, td {
    border: 1px solid #808080;
    padding: 4px;
    text-align: center;
}
</style>
</head>

<body>

<div class="window">

    <div class="titlebar">No-Guess Minesweeper</div>

    <div class="controls">
        <button id="easy" class="active" onclick="setDifficulty('easy')">Easy</button>
        <button id="medium" onclick="setDifficulty('medium')">Medium</button>
        <button id="hard" onclick="setDifficulty('hard')">Hard</button>
    </div>

    <div class="status">
        <div class="panel">MINES <span id="mines">10</span></div>
        <button onclick="newGame()">NEW</button>
        <div class="panel">TIME <span id="time">0</span></div>
        <div class="panel">FLAGS <span id="flags">0</span></div>
    </div>

    <div id="board"></div>
    <div class="message" id="message"></div>

    <div class="scores">
        <h2>HIGH SCORES</h2>
        <table>
            <tr><th>Rank</th><th>Name</th><th>Diff</th><th>Time</th></tr>
            <tr><td colspan="4">No scores yet</td></tr>
        </table>
    </div>

</div>

<script>
let rows=9, cols=9, mines=10;
let board=[], revealed=[], flagged=[];
let firstClick=true, gameOver=false;
let timer=0, interval;

const diffs={
    easy:{rows:9,cols:9,mines:10},
    medium:{rows:16,cols:16,mines:40},
    hard:{rows:16,cols:30,mines:99}
};

function setDifficulty(d){
    Object.assign({rows,cols,mines},diffs[d]);
    document.querySelectorAll(".controls button").forEach(b=>b.classList.remove("active"));
    document.getElementById(d).classList.add("active");
    newGame();
}

function newGame(){
    clearInterval(interval);
    timer=0; firstClick=true; gameOver=false;
    document.getElementById("time").textContent=0;
    document.getElementById("flags").textContent=0;
    document.getElementById("mines").textContent=mines;
    document.getElementById("message").textContent="";
    board=Array(rows).fill().map(()=>Array(cols).fill(0));
    revealed=Array(rows).fill().map(()=>Array(cols).fill(false));
    flagged=Array(rows).fill().map(()=>Array(cols).fill(false));
    draw();
}

function draw(){
    const b=document.getElementById("board");
    b.innerHTML="";
    b.style.gridTemplateColumns=`repeat(${cols},24px)`;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
        let d=document.createElement("div");
        d.className="cell";
        d.onclick=()=>click(r,c);
        d.oncontextmenu=e=>{e.preventDefault();flag(r,c)};
        d.dataset.r=r; d.dataset.c=c;
        b.appendChild(d);
    }
}

function startTimer(){
    interval=setInterval(()=>{timer++;document.getElementById("time").textContent=timer;},1000);
}

function place(sr,sc){
    let placed=0;
    while(placed<mines){
        let r=Math.random()*rows|0,c=Math.random()*cols|0;
        if(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1)continue;
        if(board[r][c]!==-1){board[r][c]=-1;placed++;}
    }
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
        if(board[r][c]===-1)continue;
        let n=0;
        for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
            let nr=r+dr,nc=c+dc;
            if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&board[nr][nc]===-1)n++;
        }
        board[r][c]=n;
    }
}

function click(r,c){
    if(gameOver||revealed[r][c]||flagged[r][c])return;
    if(firstClick){place(r,c);startTimer();firstClick=false;}
    if(board[r][c]===-1){gameOver=true;showAll();document.getElementById("message").textContent="GAME OVER";clearInterval(interval);return;}
    reveal(r,c);checkWin();
}

function flag(r,c){
    if(gameOver||revealed[r][c])return;
    flagged[r][c]=!flagged[r][c];
    document.getElementById("flags").textContent=flagged.flat().filter(Boolean).length;
    update(r,c);
}

function reveal(r,c){
    if(r<0||c<0||r>=rows||c>=cols||revealed[r][c]||flagged[r][c])return;
    revealed[r][c]=true; update(r,c);
    if(board[r][c]===0)for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)reveal(r+dr,c+dc);
}

function update(r,c){
    let d=document.querySelector(`[data-r="${r}"][data-c="${c}"]`);
    d.className="cell";
    if(flagged[r][c]){d.classList.add("flagged");d.textContent="F";return;}
    if(!revealed[r][c])return;
    d.classList.add("revealed");
    if(board[r][c]===-1){d.classList.add("mine");d.textContent="*";}
    else if(board[r][c]>0){d.textContent=board[r][c];d.classList.add("num-"+board[r][c]);}
}

function showAll(){for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){revealed[r][c]=true;update(r,c);}}

function checkWin(){
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(board[r][c]!==-1&&!revealed[r][c])return;
    gameOver=true;clearInterval(interval);
    document.getElementById("message").textContent="YOU WIN";
}

newGame();
</script>
</body>
</html>
