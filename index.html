<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake - Jared</title>

  <!-- Google Analytics (déjalo tal cual) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-V24Y8L5F29"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-V24Y8L5F29');
  </script>

  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }
    canvas {
      background: #000;
      margin-top: 20px;
      border: 2px solid white;
    }
  </style>
</head>

<body>
  <h1>🐍 Snake</h1>
  <p>Use arrow keys</p>

  <canvas id="game" width="400" height="400"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const box = 20;
    let snake = [{ x: 9 * box, y: 10 * box }];
    let food = {
      x: Math.floor(Math.random() * 19) * box,
      y: Math.floor(Math.random() * 19) * box
    };

    let dx = box;
    let dy = 0;
    let score = 0;

    document.addEventListener("keydown", direction);

    function direction(event) {
      if (event.key === "ArrowLeft" && dx === 0) {
        dx = -box; dy = 0;
      } else if (event.key === "ArrowUp" && dy === 0) {
        dx = 0; dy = -box;
      } else if (event.key === "ArrowRight" && dx === 0) {
        dx = box; dy = 0;
      } else if (event.key === "ArrowDown" && dy === 0) {
        dx = 0; dy = box;
      }
    }

    function collision(head, body) {
      return body.some(segment => head.x === segment.x && head.y === segment.y);
    }

    function draw() {
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "red";
      ctx.fillRect(food.x, food.y, box, box);

      ctx.fillStyle = "lime";
      snake.forEach(s => ctx.fillRect(s.x, s.y, box, box));

      let headX = snake[0].x + dx;
      let headY = snake[0].y + dy;

      if (headX === food.x && headY === food.y) {
        score++;
        food = {
          x: Math.floor(Math.random() * 19) * box,
          y: Math.floor(Math.random() * 19) * box
        };
      } else {
        snake.pop();
      }

      const newHead = { x: headX, y: headY };

      if (
        headX < 0 || headY < 0 ||
        headX >= canvas.width || headY >= canvas.height ||
        collision(newHead, snake)
      ) {
        clearInterval(game);
        alert("Game Over! Score: " + score);
      }

      snake.unshift(newHead);
    }

    const game = setInterval(draw, 120);
  </script>
</body>
</html>
